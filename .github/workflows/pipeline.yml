name: birding-coach pipeline

on:
  schedule:
    - cron: '0 8 * * *'      # daily 08:00 UTC — scrape settled checklists
    - cron: '0 9 1 * *'      # 1st of month  — refit and publish
    # Drives a long backfill without anyone pressing a button. Each firing
    # works for five hours, pushes as it goes and exits; the next one reads
    # what is already stored and carries on. When the range is complete the
    # script prints "nothing to do" and exits in seconds, so leaving this in
    # place costs nothing — delete the line once the backfill is finished.
    - cron: '30 */6 * * *'   # every 6 h      — continue the backfill
  workflow_dispatch:          # and a manual button
    inputs:
      mode:
        description: 'what to run'
        # a choice, not free text: as a text box this defaulted to daily and
        # a run started without editing it looked like a monthly refit that
        # had quietly produced no model
        type: choice
        default: 'daily'
        options:
          - daily            # scrape recent checklists
          - monthly          # refit and publish
          - all              # both
          - backfill         # scrape a past date range, to fill calendar gaps
      start:
        description: 'backfill only — first date, e.g. 2025-08-25'
        default: ''
      end:
        description: 'backfill only — last date, e.g. 2025-11-01'
        default: ''
      regions:
        description: 'backfill only — counties, or a state code like US-PA'
        default: ''
      top_hotspots:
        description: 'backfill only — scrape only the N busiest hotspots (0 = every one)'
        default: '400'

# Two runs at once would both pull the shared database, scrape different days,
# and push — and whichever finished second would overwrite the other's work.
# Queue rather than cancel: a run already part-way through has days worth
# keeping, and it pushes them as it goes.
concurrency:
  group: birding-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 330       # under the 6h ceiling
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # matched to the machine the model is developed on, for the same
          # reason requirements.txt is pinned
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      # Everything in data/ must survive between runs: the checklist database,
      # and the ERA5 weather cache which otherwise costs 9 API calls to rebuild.
      # Unique key on save, prefix on restore — the documented pattern for a
      # cache that changes every run. A stable key would restore but never save.
      - name: restore data
        uses: actions/cache@v4
        with:
          path: data
          key: birding-data-${{ github.run_id }}
          restore-keys: birding-data-

      # fail loudly and specifically rather than deep inside a subprocess
      - name: preflight
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
          HF_DATASET:    ${{ secrets.HF_DATASET }}
          HF_TOKEN:      ${{ secrets.HF_TOKEN }}
        run: |
          echo "python:  $(python --version)"
          echo "workdir: $(pwd)"
          if [ -z "$EBIRD_API_KEY" ]; then
            echo "::error::EBIRD_API_KEY secret is empty or missing."
            echo "Settings -> Secrets and variables -> Actions."
            echo "The name must be exactly EBIRD_API_KEY."
            exit 1
          fi
          CLEAN=$(printf '%s' "$EBIRD_API_KEY" | tr -d '[:space:]')
          echo "EBIRD_API_KEY present (${#EBIRD_API_KEY} chars, ${#CLEAN} after trimming)"
          if [ "${#EBIRD_API_KEY}" != "${#CLEAN}" ]; then
            echo "::warning::the secret contains whitespace — it is stripped in"
            echo "code, but re-saving it without the stray newline is tidier"
          fi
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_DATASET" ]; then
            echo "::error::HF_DATASET and HF_TOKEN are both required."
            echo "The checklist history lives in a private Hugging Face"
            echo "dataset. Without them this runner would scrape into an"
            echo "empty database and refit on one week of data."
            exit 1
          fi
          echo "HF_DATASET: $HF_DATASET"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"].strip())

          # repo_info proves the token reaches this dataset at all, which is
          # the failure worth catching before the scrape is spent
          info = api.repo_info(os.environ["HF_DATASET"].strip(), repo_type="dataset")
          print(f"HF dataset: {info.id} (private={info.private})")

          # The role check is best effort. /whoami-v2 is rate limited far more
          # strictly than the rest of the API, so on a busy day it refuses and
          # a hard assert here would fail a run whose credentials are fine.
          try:
              role = api.whoami().get("auth", {}).get("accessToken", {}).get("role")
              print(f"HF token role: {role}")
              if role != "write":
                  raise SystemExit(
                      f"HF_TOKEN is a '{role}' token. The run ends by pushing "
                      "the database back, which needs write.")
          except SystemExit:
              raise
          except Exception as e:
              print(f"::warning::could not read the token role ({type(e).__name__}). "
                    "Continuing — a read-only token would fail at the final push.")
          PY
          # printed so a run that produced unexpected coefficients can be
          # traced to what it was actually built against
          python - <<'PY'
          import platform
          import duckdb, numpy, pandas, requests, scipy, sklearn, statsmodels
          print(f"python {platform.python_version()} {platform.machine()}")
          for m in (numpy, scipy, pandas, sklearn, statsmodels, duckdb, requests):
              print(f"  {m.__name__:12} {m.__version__}")
          PY

      - name: run pipeline
        env:
          EBIRD_API_KEY:        ${{ secrets.EBIRD_API_KEY }}
          # the checklist database lives in a private HF dataset, not in git —
          # without these the runner starts from an empty seven-day window
          HF_DATASET:           ${{ secrets.HF_DATASET }}
          # the public dataset the app reads — coefficients only, never
          # eBird records, so it needs no token on the browser side
          HF_PUBLIC_DATASET:    ${{ secrets.HF_PUBLIC_DATASET }}
          HF_TOKEN:             ${{ secrets.HF_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPE_DELAY: '0.5'
          # Public hotspots only — parks, reserves, wildlife areas. Personal
          # locations cannot be enumerated when a day hits the 200 cap, and the
          # app never forecasts for somebody's garden either, so restricting the
          # population makes the training data match what is actually served.
          HOTSPOTS_ONLY: '1'
          # Stop cleanly before the job's 330-minute ceiling: being killed
          # mid-chunk loses whatever it had fetched, stopping deliberately does
          # not.
          BUDGET_MIN: '300'
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            # Which cron fired, asked of GitHub rather than inferred from the
            # clock. Reading `date` here was wrong twice over: scheduled runs
            # start late on shared runners — on 2026-08-24 the :30 cron fired
            # at :35 and again at :29, and the 08:00 one at 08:42 — and the
            # concurrency queue can hold a run for hours behind another. Every
            # firing therefore missed the "30" match and silently fell through
            # to daily, so the backfill schedule never once ran a backfill.
            # github.event.schedule is the cron string itself and does not move.
            case "${{ github.event.schedule }}" in
              '30 */6 * * *') MODE=backfill ;;
              '0 9 1 * *')    MODE=monthly  ;;
              *)              MODE=daily    ;;
            esac
          fi
          echo "mode: $MODE (schedule='${{ github.event.schedule }}')"

          if [ "$MODE" = "backfill" ]; then
            START="${{ inputs.start }}"
            END="${{ inputs.end }}"
            REGIONS="${{ inputs.regions }}"
            # Only the backfill narrows the site list. The daily scrape works
            # one county with no SCRAPE_SCOPE, so the same setting there would
            # rank sites within that county and keep a different four hundred
            # than the statewide ranking does — two definitions of "the busiest
            # sites" writing into one database.
            export TOP_HOTSPOTS="${{ inputs.top_hotspots || '400' }}"
            echo "sites: top $TOP_HOTSPOTS hotspots"
            # A scheduled backfill has no inputs, so it falls back to the
            # standing range: the last twelve months across the configured
            # regions. The script trims the end date to what has settled and
            # skips region-days already stored, so this is safe to fire
            # repeatedly.
            : "${START:=$(date -u -d '1 year ago' +%Y-%m-%d 2>/dev/null || date -u -v-1y +%Y-%m-%d)}"
            : "${END:=$(date -u +%Y-%m-%d)}"
            : "${REGIONS:=${BACKFILL_REGIONS:-US-PA}}"
            echo "backfill $START .. $END  regions=$REGIONS"
            # --max-days keeps a run inside the job timeout. The script skips
            # days already stored, so running it again continues where it
            # stopped rather than starting over.
            python -u pipeline/backfill.py "$START" "$END" \
              --regions "$REGIONS" --budget-min "$BUDGET_MIN"
          else
            python -u pipeline/run.py "$MODE"
          fi

      - name: keep the coefficients as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-coefficients
          path: data/model_coefficients.*
          if-no-files-found: ignore
