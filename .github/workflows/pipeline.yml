name: birding-coach pipeline

on:
  schedule:
    - cron: '0 8 * * *'      # daily 08:00 UTC — scrape settled checklists
    - cron: '0 9 1 * *'      # 1st of month  — refit and publish
  workflow_dispatch:          # and a manual button
    inputs:
      mode:
        description: 'daily | monthly | all'
        default: 'daily'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 330       # under the 6h ceiling
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Everything in data/ must survive between runs: the checklist database,
      # and the ERA5 weather cache which otherwise costs 9 API calls to rebuild.
      # Unique key on save, prefix on restore — the documented pattern for a
      # cache that changes every run. A stable key would restore but never save.
      - name: restore data
        uses: actions/cache@v4
        with:
          path: data
          key: birding-data-${{ github.run_id }}
          restore-keys: birding-data-

      # fail loudly and specifically rather than deep inside a subprocess
      - name: preflight
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          echo "python:  $(python --version)"
          echo "workdir: $(pwd)"
          if [ -z "$EBIRD_API_KEY" ]; then
            echo "::error::EBIRD_API_KEY secret is empty or missing."
            echo "Settings -> Secrets and variables -> Actions."
            echo "The name must be exactly EBIRD_API_KEY."
            exit 1
          fi
          CLEAN=$(printf '%s' "$EBIRD_API_KEY" | tr -d '[:space:]')
          echo "EBIRD_API_KEY present (${#EBIRD_API_KEY} chars, ${#CLEAN} after trimming)"
          if [ "${#EBIRD_API_KEY}" != "${#CLEAN}" ]; then
            echo "::warning::the secret contains whitespace — it is stripped in"
            echo "code, but re-saving it without the stray newline is tidier"
          fi
          python -c "import duckdb, pandas, sklearn, statsmodels, requests; print('imports ok')"

      - name: run pipeline
        env:
          EBIRD_API_KEY:        ${{ secrets.EBIRD_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPE_DELAY: '0.5'
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            # the monthly cron fires at 09:00; the daily one at 08:00
            [ "$(date -u +%H)" = "09" ] && MODE=monthly || MODE=daily
          fi
          echo "mode: $MODE"
          python -u pipeline/run.py "$MODE"

      - name: keep the coefficients as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-coefficients
          path: data/model_coefficients.*
          if-no-files-found: ignore
